<path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="94" x2="340" y2="120" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="184" x2="340" y2="210" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="274" x2="340" y2="300" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="364" x2="340" y2="390" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="454" x2="340" y2="480" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="544" x2="340" y2="570" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="634" x2="340" y2="660" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="724" x2="340" y2="750" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="130" y="30" width="420" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="340" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Data loading</text>
<text x="340" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">UCI Automobile dataset via ucimlrepo</text>
</g>

<g>
<rect x="130" y="120" width="420" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
