<text x="340" y="704" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Test R² = 0.951, MAPE = 8.98%</text>
</g>

<g>
<rect x="130" y="750" width="420" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="340" y="774" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#134e4a">Deployment</text>
<text x="340" y="794" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0f766e">Interactive Gradio interface</text>
