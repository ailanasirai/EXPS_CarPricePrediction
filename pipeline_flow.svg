<text x="340" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Missing values imputed, duplicates checked</text>
</g>

<g>
<rect x="130" y="210" width="420" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="340" y="234" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Exploratory data analysis</text>
<text x="340" y="254" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Distributions, correlations, brand pricing</text>
</g>

<g>
<rect x="130" y="300" width="420" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="340" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Feature engineering</text>
<text x="340" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">One-hot encoding of categorical variables</text>
</g>

<g>
<rect x="130" y="390" width="420" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="340" y="414" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Baseline model</text>
<text x="340" y="434" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Linear regression, R² = 0.951</text>
</g>

<g>
<rect x="130" y="480" width="420" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="340" y="504" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Model comparison</text>
<text x="340" y="524" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Ridge vs random forest vs gradient boosting</text>
</g>

<g>
<rect x="130" y="570" width="420" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="340" y="594" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Hyperparameter tuning</text>
<text x="340" y="614" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">GridSearchCV, 5-fold cross-validation</text>
